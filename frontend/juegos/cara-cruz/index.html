<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Virtual · Cara o cruz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="cara-cruz.css">
</head>

<body>
    <!-- Ilustraciones reutilizables (mismas que en index.html) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="g-oro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fde68a"/>
        <stop offset=".5" stop-color="#fbbf24"/>
        <stop offset="1" stop-color="#b45309"/>
        </linearGradient>
    </defs>
    <symbol id="moneda" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="url(#g-oro)"/>
        <circle cx="50" cy="50" r="36" fill="none" stroke="#b45309" stroke-width="4" opacity=".55"/>
        <text x="50" y="64" text-anchor="middle" font-size="40" font-weight="900" fill="#92400e" font-family="Montserrat, sans-serif">T</text>
    </symbol>
    <symbol id="ficha" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="#7c3aed"/>
        <circle cx="50" cy="50" r="43" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="14 11"/>
        <circle cx="50" cy="50" r="28" fill="#5b21b6" stroke="#c4b5fd" stroke-width="3"/>
    </symbol>
    </svg>

    <div class="marco">

    <!-- ===== Barra superior ===== -->
    <header class="barra">
        <div class="barra-izq">
        <a href="../../index.html" class="logo">
            <svg class="logo-icono"><use href="#ficha"/></svg>
            <span>Casino<b>Virtual</b></span>
        </a>
        </div>
        <div class="barra-der">
        <div class="saldo" title="Tu saldo de tokens">
            <svg><use href="#moneda"/></svg>
            <span id="saldoTokens">—</span>
        </div>
        <a href="../../index.html" class="enlace">← Volver al inicio</a>
        </div>
    </header>

    <main class="cc">

        <div class="cc-titulo">
        <p class="etiqueta">Juego</p>
        <h1>Cara o <span>cruz</span></h1>
        <p class="cc-reglas">Elige un lado y lanza. Si aciertas, recibes el doble de tu apuesta.</p>
        </div>

        <div class="cc-cuerpo">

        <!-- ===== Mesa con la moneda ===== -->
        <section class="mesa">
            <div class="escena">
            <!-- La moneda: dos caras dibujadas con CSS y SVG propio.
                 OJO: el id NO puede ser "moneda", ese ya lo usa el <symbol> del saldo. -->
            <div class="moneda-salto" id="monedaSalto">
                <div class="moneda-juego" id="monedaJuego" aria-hidden="true">
                <div class="lado lado-cara">
                    <svg class="simbolo" viewBox="0 0 100 100">
                    <polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/>
                    </svg>
                    <span class="texto">Cara</span>
                </div>
                <div class="lado lado-cruz">
                    <span class="simbolo cruz-dibujo"></span>
                    <span class="texto">Cruz</span>
                </div>
                </div>
            </div>
            <div class="sombra" id="sombra"></div>
            </div>

            <p class="mensaje-mesa" id="mensajeMesa" role="status">Elige cara o cruz, tu apuesta y pulsa Lanzar.</p>
        </section>

        <!-- ===== Historial ===== -->
        <aside class="historial">
            <h2>Últimas tiradas</h2>
            <ol class="historial-lista" id="historialLista"></ol>
            <p class="historial-vacio" id="historialVacio">Aún no has jugado.</p>
        </aside>

        </div>

        <!-- ===== Controles ===== -->
        <section class="controles">
        <div class="apuesta">
            <label for="apuesta">Apuesta</label>
            <div class="apuesta-fila">
            <input type="number" id="apuesta" min="1" step="1" value="10" inputmode="numeric">
            <button type="button" class="ficha-rapida" data-valor="10">+10</button>
            <button type="button" class="ficha-rapida" data-valor="50">+50</button>
            <button type="button" class="ficha-rapida" data-valor="100">+100</button>
            <button type="button" class="ficha-rapida" data-valor="500">+500</button>
            <button type="button" class="ficha-rapida limpiar" id="limpiarApuesta">Limpiar</button>
            </div>
            <p class="mensaje-error" id="mensajeError" role="alert"></p>
        </div>

        <div class="eleccion" role="group" aria-label="Elige un lado">
            <button type="button" class="lado-boton" data-lado="CARA" aria-pressed="false">
            <span class="mini-moneda">★</span>Cara
            </button>
            <button type="button" class="lado-boton" data-lado="CRUZ" aria-pressed="false">
            <span class="mini-moneda">✚</span>Cruz
            </button>
        </div>

        <div class="acciones">
            <button type="button" class="accion principal" id="btnLanzar" disabled>Lanzar</button>
        </div>
        </section>

    </main>
    </div>

    <script type="module" src="cara-cruz.js"></script>
</body>
</html>
